name: Static portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check portfolio JavaScript syntax
        run: node --check script.js
      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          class Parser(HTMLParser):
              def error(self, message):
                  raise ValueError(message)

          Parser(convert_charrefs=True).feed(html)

          required = [
              '<!doctype html',
              '<html lang="en">',
              '<meta name="viewport"',
              '<title>',
              'id="main-content"',
              'id="projects-grid"',
              'id="project-modal"',
              'id="contact"',
          ]
          missing = [x for x in required if x not in html.lower()]
          if missing:
              raise SystemExit("Missing required HTML markers: " + ", ".join(missing))

          if re.search(r'href=["\']javascript:', html, re.I):
              raise SystemExit("javascript: URLs are not allowed")
          print("HTML structure and required landmarks validated.")
          PY
      - name: Verify required static assets
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f robots.txt
          test -f sitemap.xml
          test -f favicon.svg
      - name: Check repository whitespace
        run: git diff --check
