name: Static portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check portfolio JavaScript syntax
        run: node --check script.js
      - name: Verify required static assets
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f robots.txt
          test -f sitemap.xml
          test -f favicon.svg
